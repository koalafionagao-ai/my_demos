<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talkdesk Email Autopilot · Admin Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#eef1f5;--surface:#fff;--border:#e8ecf1;--text:#1a1d23;
  --muted:#5c6370;--faint:#9aa3af;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --blue:#3b6cff;--blue-bg:#eef3ff;
  --green:#059669;--green-bg:#ecfdf5;
  --red:#dc2626;--red-bg:#fef2f2;
  --shadow:0 4px 24px rgba(26,29,35,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh}
.app{max-width:1680px;margin:0 auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;line-height:1.2}
.who-av{width:28px;height:28px;border-radius:50%;background:#eceff3;color:#1a1d23;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.who b{display:block;font-size:13px;font-weight:650}
.who small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.btn{font-size:11px;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.primary{background:#1a1d23;color:#fff;border-color:#1a1d23}
.btn.primary:hover:not(:disabled){background:#2a2e36}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#1a1d23;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:420px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;font-size:11px;color:var(--faint);font-family:var(--mono);padding:10px 0 6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px}
.footer a{color:var(--text);text-decoration:none;font-weight:600;opacity:.72}
.footer a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.footer .sep{color:#d0d5dd}

.wf-chrome{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.wf-chrome h1{font-size:15px;font-weight:700}
.wf-chrome .meta{font-size:11px;color:var(--muted);margin-top:2px}
.wf-chrome > div:first-child{flex:1;min-width:160px}
.wf-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.wf-status{font-size:12px;color:var(--muted);margin-right:4px}
.wf-status b{color:var(--text);font-weight:650}
.wf-fixture{font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;color:var(--text)}
.wf-body{display:grid;grid-template-columns:minmax(420px,1.15fr) minmax(300px,380px) minmax(280px,320px);gap:10px;min-height:calc(100vh - 150px);align-items:stretch}
.wf-canvas-wrap,.wf-mail,.wf-cfg{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:560px;max-height:calc(100vh - 150px)}
.col-head{padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);flex-shrink:0;background:#fafbfc}
.col-body{flex:1;overflow:auto;padding:10px 12px;min-height:0}
.wf-canvas-wrap{position:relative;background:#f6f7f9;background-image:radial-gradient(#d9dee6 1px,transparent 1px);background-size:18px 18px;cursor:grab;touch-action:none}
.wf-canvas-wrap.panning{cursor:grabbing}
.wf-zoom{position:absolute;top:10px;right:10px;z-index:3;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:3px 6px;font-size:11px;font-family:var(--mono)}
.wf-zoom button{width:24px;height:24px;border:0;background:#f3f4f6;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;font-weight:700}
.wf-zoom button:hover{background:#e8ecf1}
.wf-zoom #zoomLabel{min-width:40px;text-align:center}
.wf-stage-scale{transform-origin:0 0;width:1180px;height:920px;will-change:transform}
.wf-stage{position:relative;width:1180px;height:920px}
.wf-edge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lane-label{position:absolute;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);pointer-events:none}
.lane-zone{position:absolute;border-radius:16px;border:1px dashed transparent;pointer-events:none;z-index:0}
.lane-zone .lz-title{position:absolute;left:10px;top:6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:1;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.2}
.wf-legend{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:10px;font-family:var(--mono);color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.wf-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wf-legend .lg-api{background:#0284c7}
.wf-legend .lg-llm{background:#eab308}
.wf-legend .lg-fail{background:#dc2626}

.wn{position:absolute;width:132px;background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:8px 10px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:box-shadow .2s,border-color .2s,opacity .2s;z-index:1}
.wn.on{border-color:#1a1d23;box-shadow:0 0 0 3px rgba(26,29,35,.12)}
.wn.run{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,108,255,.2);animation:wfPulse 1.1s ease-in-out infinite}
@keyframes wfPulse{0%,100%{box-shadow:0 0 0 3px rgba(59,108,255,.18)}50%{box-shadow:0 0 0 6px rgba(59,108,255,.28)}}
.wn.done{border-color:#a7f3d0;background:#f6fffa}
.wn.risk{border-color:#fecaca;background:#fff8f8}
.wn.skip{opacity:.28}
.wn.start,.wn.end{width:120px;text-align:center;background:#1a1d23;color:#fff;border:0;padding:8px 10px;border-radius:999px;font-weight:700;font-size:12px}
.wn.orch-bar{width:320px;border-left:3px solid #1a1d23;padding:10px 14px}
.wn.wn-api{border-left:4px solid #0284c7}
.wn.wn-llm{border-left:4px solid #eab308}
.wn .wt{font-size:11px;font-weight:700;line-height:1.25}
.wn .wtool{font-size:9px;font-family:var(--mono);color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn.wn-api .wtool::before{content:"● ";color:#0284c7}
.wn.wn-llm .wtool::before{content:"● ";color:#ca8a04}
.wn .wmeta{font-size:9px;font-family:var(--mono);color:var(--faint);margin-top:5px}
.wn .wmeta .ok{color:var(--green);font-weight:700}
.wn .wmeta .bad{color:var(--red);font-weight:700}
.wn .wmeta .runing{color:var(--blue);font-weight:700}
.wn.out-node{width:180px}
.wn.out-node .witems{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.wn.out-node .witems span{font-size:10px;color:var(--muted);line-height:1.3}
.wn.out-node .witems span::before{content:"· ";color:var(--faint)}

.wf-cfg{position:relative;flex-direction:row}
.cfg-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.cfg-rail{width:36px;flex-shrink:0;border-left:1px solid var(--border);background:#eef1f5;display:flex;flex-direction:column;align-items:stretch;padding:10px 0;gap:6px}
.cfg-rail button{border:0;background:#dde2e8;color:#5c6370;cursor:pointer;padding:14px 0;margin-left:4px;border-radius:10px 0 0 10px;font-size:10px;font-weight:700;letter-spacing:.04em;writing-mode:vertical-lr;text-orientation:mixed;min-height:88px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.cfg-rail button:hover{background:#cfd6de;color:var(--text)}
.cfg-rail button.on{background:#1a1d23;color:#fff;margin-left:0;padding-left:2px;box-shadow:none}
.cfg-body{padding:12px 14px;overflow:auto;flex:1;min-height:0}

.ticket-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;margin-bottom:8px}
.ticket-card .tid-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket-card .tid{font-family:var(--mono);font-size:12px;font-weight:700}
.ticket-card .tstatus{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.ticket-card .tstatus.open{background:#e0f2fe;color:#0369a1}
.ticket-card .tstatus.progress{background:#e0e7ff;color:#4338ca}
.ticket-card .tstatus.waiting{background:#fef9c3;color:#a16207}
.ticket-card .tstatus.resolved{background:#dcfce7;color:#15803d}
.ticket-card .tstatus.closed{background:#e5e7eb;color:#4b5563}
.ticket-card .tt{font-size:13px;font-weight:650;margin-top:6px}
.ticket-card .tm{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
.ticket-card .tsec{margin-top:10px;padding-top:10px;border-top:1px solid #f1f3f6}
.ticket-card .tsec-lab{font-size:9px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.ticket-card .tfiles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ticket-card .tfiles li{font-size:11px;font-family:var(--mono);color:var(--text);padding:5px 8px;background:#f6f7f9;border-radius:8px}
.ticket-card .tfiles .empty{color:var(--faint);font-family:inherit;background:transparent;padding:0}
.ticket-card .tsummary{font-size:11px;line-height:1.55;color:var(--text);white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:8px 10px}
.ticket-upd-head{font-size:10px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
.ticket-upd{position:relative;padding-left:16px}
.ticket-upd::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:#e5e8ed}
.ticket-upd-row{position:relative;padding:0 0 12px 0}
.ticket-upd-row:last-child{padding-bottom:0}
.ticket-upd-row .tud{position:absolute;left:-16px;top:4px;width:10px;height:10px;border-radius:50%;background:#94a3b8;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8}
.ticket-upd-row.on .tud{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.ticket-upd-row .tu-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:4px}
.ticket-upd-row .tu-time{font-family:var(--mono);font-size:10px;color:var(--faint)}
.ticket-upd-row .tu-status{font-size:12px;font-weight:700;color:var(--text)}
.ticket-upd-row .tu-owner{font-size:10px;color:var(--muted)}
.ticket-upd-row .tu-detail{font-size:11px;color:var(--muted);line-height:1.4}

.takeover-card{max-width:92%;border:1px dashed #ca8a04;border-radius:14px;padding:14px 14px 12px;background:#fffbeb;box-shadow:0 2px 10px rgba(202,138,4,.1)}
.takeover-card .to-kicker{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#a16207;margin-bottom:6px}
.takeover-card .to-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.takeover-card .to-body{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.takeover-card button{border:0;background:#1a1d23;color:#fff;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.takeover-card button:hover{background:#333}
.takeover-card.done{border-style:solid;opacity:.95}
.takeover-card.done .to-body{margin-bottom:0}
.takeover-card.done button{display:none}

.log-human{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:#fef9c3;color:#a16207;margin-left:6px;vertical-align:middle}
.log-meta .log-human{margin-left:0}

.task-list{display:flex;flex-direction:column;gap:8px}
.task-card{border:1px solid var(--border);border-radius:10px;background:#fff;padding:10px 12px}
.task-card.run{border-color:#1a1d23}
.task-card.done{border-color:#a7f3d0}
.task-card .th{display:flex;align-items:baseline;gap:8px;min-width:0}
.task-card .tid{font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}
.task-card .tt{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task-card .tm{font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-steps{margin-top:8px;padding-top:8px;border-top:1px solid #f1f3f6;display:flex;flex-direction:column;gap:4px}
.task-step{display:flex;align-items:center;gap:8px;font-size:11px;line-height:1.3;min-width:0}
.task-step .mk{width:14px;flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--faint)}
.task-step.run .mk{color:var(--blue)}
.task-step.done .mk{color:var(--green)}
.task-step .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task-card.creating{border-style:dashed;opacity:.85}
.task-card .tresult{margin-top:8px;padding-top:8px;border-top:1px solid #f1f3f6}
.task-card .tresult-lab{font-size:9px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.task-card .tresult pre{margin:0;padding:8px 10px;background:#f6f7f9;border-radius:8px;font-family:var(--mono);font-size:10px;line-height:1.4;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:140px;overflow:auto}

.log-head{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.4}
.pv-result-banner{margin:0 0 10px;padding:8px 10px;background:#f4f5f7;border-radius:10px;font-size:11px;font-weight:700;line-height:1.35}
.log-tl{position:relative;padding-left:18px}
.log-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#e5e8ed}
.log-row{position:relative;padding:0 0 14px 0}
.log-row:last-child{padding-bottom:0}
.log-dot{position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:#c5cbd4;border:2px solid #fff;box-shadow:0 0 0 1px #c5cbd4}
.log-row.on .log-dot{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.log-row.ok .log-dot{background:var(--green);box-shadow:0 0 0 1px var(--green)}
.log-row.risk .log-dot{background:var(--red);box-shadow:0 0 0 1px var(--red)}
.log-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:4px}
.log-time{font-family:var(--mono);font-size:10px;color:var(--faint)}
.log-agent{font-size:10px;font-weight:700;color:var(--blue)}
.log-node{font-size:11px;font-weight:650;color:var(--text)}
.log-action{font-size:11px;color:var(--muted);margin-bottom:4px;line-height:1.35}
.log-result{font-family:var(--mono);font-size:10px;margin-bottom:6px}
.log-result.ok{color:var(--green)}
.log-result.risk{color:var(--red)}
.log-schema{position:relative;display:inline-block}
.log-schema-sum{font-family:var(--mono);font-size:9px;color:var(--faint);cursor:default;border-bottom:1px dashed #c5cbd4;padding-bottom:1px}
.log-schema-pop{display:none;position:absolute;left:0;top:100%;z-index:20;min-width:220px;max-width:280px;padding:16px 10px 10px;background:#1a1d23;color:#f3f4f6;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.22);font-family:var(--mono);font-size:10px;line-height:1.4;white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text}
.log-schema:hover .log-schema-pop,.log-schema:focus-within .log-schema-pop{display:block}

.thread{display:flex;flex-direction:column;gap:10px}
.thread-row{display:flex;width:100%}
.thread-row.in{justify-content:flex-start}
.thread-row.out{justify-content:flex-end}
.thread-msg{max-width:88%;border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:#fff;font-size:11px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.03);opacity:1;transform:translateY(0);transition:opacity .4s ease,transform .3s ease,box-shadow .2s}
.thread-row.in .thread-msg{border-bottom-left-radius:4px;background:#f5f8ff;border-color:#bfd0ff;border-left:3px solid #3b82f6}
.thread-row.out .thread-msg{border-bottom-right-radius:4px;background:#f3faf6;border-color:#b7e4cf;border-left:3px solid #059669}
.thread-row.out.human-out .thread-msg{background:#fffbeb;border-color:#fcd34d;border-left:3px solid #f59e0b}
.thread-msg.new{box-shadow:0 0 0 2px rgba(26,29,35,.1);animation:mailIn .45s ease}
@keyframes mailIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.thread-msg .mh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-family:var(--mono);font-size:9px;color:var(--muted);align-items:center}
.mail-icon{font-size:13px;margin-right:4px;line-height:1}
.thread-msg .ms{font-weight:700;font-size:12px;margin-bottom:4px}
.thread-msg .mf{font-size:10px;color:var(--muted);margin-bottom:6px}
.thread-msg .mb{white-space:pre-wrap;color:var(--text)}
.thread-msg .md{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06);font-size:10px;color:var(--muted)}
.pv-empty{font-size:11px;color:var(--faint);padding:16px 8px;text-align:center;line-height:1.45}

.cfg-mode{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cfg-mode button{flex:1;border:0;background:#fff;padding:7px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted)}
.cfg-mode button.on{background:#1a1d23;color:#fff}
.cfg-node-title{font-size:12px;font-weight:700;margin-bottom:4px}
.cfg-subtitle{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px}
.cfg-meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.cfg-type{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;text-transform:uppercase}
.cfg-type.llm{background:#fef9c3;color:#a16207}
.cfg-type.api{background:#e0f2fe;color:#0369a1}
.cfg-type.composite{background:#f3e8ff;color:#7e22ce}
.cfg-from{font-size:10px;font-family:var(--mono);color:var(--faint)}
.cfg-map{font-size:10px;color:var(--muted);line-height:1.4;margin:-2px 0 10px;padding:6px 8px;background:#f6f7f9;border-radius:8px}
.cfg-map b{font-weight:700;color:var(--text)}
.cfg-hint{font-size:11px;color:var(--muted);line-height:1.4;margin:0 0 12px}
.cfg-zone{margin-bottom:14px}
.cfg-zone-lab{font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f1f3f6}
.cfg-field-map{font-size:9px;font-family:var(--mono);color:var(--blue);margin-top:2px}
.cfg-sec{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}
.cfg-sec > summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text);background:#fafbfc;display:flex;justify-content:space-between;align-items:center}
.cfg-sec > summary::-webkit-details-marker{display:none}
.cfg-sec > summary::after{content:"▾";color:var(--faint);font-size:10px}
.cfg-sec:not([open]) > summary::after{content:"▸"}

.tog.off::after{right:auto;left:3px}
.check-list{display:flex;flex-direction:column;gap:6px;font-size:12px}

function fx(){return FIXTURES[wfLastKind]}
function wfNodeById(id){return WF_NODES.find(n=>n.id===id)}
function nw(n){return n.w||132}
function nh(n){return n.h||70}
function ncx(n){return n.x+nw(n)/2}
function ncy(n){return n.y+nh(n)/2}
function stepKey(tid,sid){return tid+":"+sid}
function taskById(tid){return (fx().tasks||[]).find(t=>t.id===tid)}
function stepMeta(tid,sid){
  const t=taskById(tid); if(!t)return null;
  const i=(t.steps||[]).findIndex(s=>s.id===sid);
  return i<0?null:{step:t.steps[i],index:i,total:t.steps.length};
}
function beatNodeId(st){return st.nodeId||st.id}

function edgeSvg(e){
  const A=wfNodeById(e.a),B=wfNodeById(e.b);
  if(!A||!B)return "";
  const off=e.offset||0;
  let x1,y1,x2,y2,d;
  if(e.dir==="h"){
    const leftToRight=A.x<B.x;
    x1=leftToRight?A.x+nw(A):A.x;y1=ncy(A)+off;
    x2=leftToRight?B.x:B.x+nw(B);y2=ncy(B)+off;
    const dx=Math.max(40,Math.abs(x2-x1)*0.45);
    if(leftToRight) d=`M${x1} ${y1} C${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
    else d=`M${x1} ${y1} C${x1-dx} ${y1}, ${x2+dx} ${y2}, ${x2} ${y2}`;
  }else if(e.dir==="fan"){
    x1=ncx(A);y1=A.y+nh(A);x2=ncx(B)+off;y2=B.y;
    const mid=y1+22+Math.abs(off)*0.3;
    d=`M${x1} ${y1} C${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
  }else{
    x1=ncx(A);y1=A.y+nh(A);x2=ncx(B);y2=B.y;
    const mid=(y1+y2)/2;
    d=`M${x1} ${y1} C${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
  }
  const fail=e.cls==="fail";
  const stroke=fail?"#dc2626":"#c5cbd4";
  const dash=fail?' stroke-dasharray="5 4"':"";
  const marker=fail?"url(#arrFail)":"url(#arr)";
  return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.6"${dash} marker-end="${marker}"/>`;
}

function toolTypeClass(n){
  if(n.cls==="start"||n.cls==="end"||n.cls==="orch-bar"||n.cls==="out-node") return "";
  const t=n.tool||"";
  if(/\bLLM\b/i.test(t)) return "wn-llm";
  if(t) return "wn-api";
  return "";
}

function nodeMetaHtml(n){
  const mark=wfMark[n.id]||"";
  const dur=wfDur[n.id];
  const durTxt=dur!=null?` · ${dur}`:"";
  if(n.outputs&&n.outputs.length){
    const items=n.outputs.map(t=>`<span>${t}</span>`).join("");
    let st="";
    if(mark==="run") st=`<div class="wmeta"><span class="runing">Running</span></div>`;
    else if(mark==="done") st=`<div class="wmeta"><span class="ok">Success</span>${durTxt}</div>`;
    else if(mark==="risk") st=`<div class="wmeta"><span class="bad">Failed</span>${durTxt}</div>`;
    else if(mark==="skip") st=`<div class="wmeta">Skipped</div>`;
    return `<div class="witems">${items}</div>${st}`;
  }
  if(n.cls==="start"){
    if(mark==="run") return `<div class="wmeta"><span class="runing">Running</span></div>`;
    if(mark==="done") return `<div class="wmeta"><span class="ok">Success</span>${durTxt}</div>`;
    return "";
  }
  if(mark==="run") return `<div class="wmeta"><span class="runing">Running</span></div>`;
  if(mark==="done") return `<div class="wmeta"><span class="ok">Success</span>${durTxt}</div>`;
  if(mark==="risk") return `<div class="wmeta"><span class="bad">Failed</span>${durTxt}</div>`;
  if(mark==="skip") return `<div class="wmeta">Skipped</div>`;
  return "";
}

function renderWfCanvas(){
  const stage=document.getElementById("wfStage");
  if(!stage)return;
  const zones=LANE_ZONES.map(z=>`<div class="lane-zone" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px;background:${z.color};border-color:${z.border}"><span class="lz-title" style="color:${z.title}">${z.label}</span></div>`).join("");
  const linesSvg=WF_EDGES.map(edgeSvg).join("");
  const nodes=WF_NODES.map(n=>{
    const run=wfMark[n.id]||"";
    const tt=toolTypeClass(n);
    const extra=[n.cls||"",tt,wfSel===n.id?"on":"",run].filter(Boolean).join(" ");
    const tool=(n.cls==="start"||n.cls==="end")?"":(n.tool?`<div class="wtool">${n.tool}</div>`:"");
    return `<div class="wn ${extra}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${nw(n)}px">
      <div class="wt">${n.title}</div>${tool}${nodeMetaHtml(n)}

  stage.innerHTML=`<svg class="wf-edge" viewBox="0 0 1180 920"><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#c5cbd4"/></marker>
    <marker id="arrFail" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#dc2626"/></marker>

function taskProgressLine(tid){
  const t=taskById(tid);
  const n=(t&&t.steps||[]).length;
  const p=wfTaskProg[tid];
  if(!p)return `${n} steps · waiting`;
  if(p.status==="done")return `${n} steps · complete`;
  return `${n} steps · ${p.i}/${n} · ${p.name}`;
}

function mailIndex(id){
  const i=wfLiveMails.indexOf(id);
  return i>=0?i+1:null;
}

function mailStreamLabel(id){
  const n=mailIndex(id);
  return n!=null?"#"+n:String(id);
}

function rewriteMailRefs(val){
  if(typeof val==="string"){
    if(Object.prototype.hasOwnProperty.call(MAIL,val)) return mailStreamLabel(val);
    return val.replace(/\b([AB]\d+[a-z]?)\b/g,(m)=>{
      if(Object.prototype.hasOwnProperty.call(MAIL,m)) return mailStreamLabel(m);
      return m;
    });
  }
  if(Array.isArray(val)) return val.map(rewriteMailRefs);
  if(val&&typeof val==="object"){
    const out={};
    Object.keys(val).forEach(k=>{out[k]=rewriteMailRefs(val[k])});
    return out;
  }
  return val;
}

function deriveLogSchema(st){
  let raw;
  if(st.data) raw=st.data;
  else{
    const input={}, tools={}, output={};
    (st.think||[]).forEach(r=>{ input[r.k]=r.v; });
    (st.action||[]).forEach((a,i)=>{ output["action_"+(i+1)]=a; });
    const node=wfNodeById(beatNodeId(st));
    if(node&&node.tool) tools.tool=node.tool;
    raw={input, tools, output};
  }
  return rewriteMailRefs(raw);
}

function ensureTicketLive(){
  if(wfTicketLive) return wfTicketLive;
  const tk=(fx().ticket)||{};
  wfTicketLive={
    id:tk.id||"—",
    title:tk.title||"Case",
    customer:tk.customer||"—",
    status:"Open",
    statusClass:"open",
    owner:"Autopilot",
    files:[],
    summary:"Ticket opened from inbound email."
  };
  return wfTicketLive;
}

function filesSig(files){
  return (files||[]).map(f=>f.name+"|"+(f.note||"")).join(";");
}

function applyTicketPatch(st, at){
  if(!st.ticket&&!(st.mails&&st.mails.length)) return false;
  const t=ensureTicketLive();
  const prevStatus=t.status;
  const p=st.ticket||{};
  if(p.status!=null) t.status=p.status;
  if(p.statusClass!=null) t.statusClass=p.statusClass;
  else if(p.status){
    const map={Open:"open","In Progress":"progress",Waiting:"waiting",Resolved:"resolved",Closed:"closed"};
    if(map[p.status]) t.statusClass=map[p.status];
  }
  if(p.owner!=null) t.owner=p.owner;
  if(p.summary!=null) t.summary=p.summary;
  if(p.files) t.files=p.files.slice();
  // Timeline is status-only: ignore mail/validation/file noise unless status changes
  if(t.status===prevStatus&&wfTicketLogs.length) return true;
  wfTicketLogs.push({
    at:at||logTimeFor(st, wfTicketLogs.length),
    status:t.status,
    statusClass:t.statusClass||"open",
    owner:t.owner,
    detail:p.note||"",
    files:(t.files||[]).map(f=>({name:f.name,note:f.note}))
  });
  return true;
}

function applyTicketDirect(patch, at){
  return applyTicketPatch({ticket:patch}, at||"");
}

function applyTaskBeat(st){
  if(!st.taskId) return false;
  const isNewTask=!wfOpenTasks.includes(st.taskId);
  if(isNewTask) wfOpenTasks.push(st.taskId);
  const meta=stepMeta(st.taskId,st.stepId);
  const tdef=taskById(st.taskId)||{};
  const n=meta?meta.total:(tdef.steps||[]).length;
  const idx=meta?meta.index+1:0;
  const name=meta?meta.step.name:(st.node||st.title||st.s);
  wfTaskProg[st.taskId]={i:idx,n,name,status:"run",stepId:st.stepId};
  wfStepData[stepKey(st.taskId,st.stepId)]=st;
  if(st.doneTask){
    wfTaskProg[st.taskId].status="done";
    const out=(st.data&&st.data.output)||tdef.result||null;
    if(out) wfTaskResults[st.taskId]=rewriteMailRefs(out);
  }
  st._newTask=isNewTask;
  return true;
}

function escHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function jsonPretty(obj){
  try{return JSON.stringify(obj,null,2)}catch(_){return String(obj)}
}

function logTimeFor(st, seq){
  if(st.at) return st.at;
  if(st.mails&&st.mails.length){
    const m=MAIL[st.mails[0]];
    if(m&&m.time) return m.time;
  }
  if(wfLastKind==="caseA"){
    const base=9*60+5+seq;
    const hh=String(Math.floor(base/60)).padStart(2,"0");
    const mm=String(base%60).padStart(2,"0");
    return hh+":"+mm;
  }
  const mins=2*60+17+seq*3;
  const day=Math.floor(mins/(24*60));
  const rem=mins%(24*60);
  const hh=String(Math.floor(rem/60)%24).padStart(2,"0");
  const mm=String(rem%60).padStart(2,"0");
  if(day<=0) return hh+":"+mm+" AM";
  return "Day "+day+" · "+hh+":"+mm;
}

function durationFor(st){
  if(st.dur) return st.dur;
  if(st.mails&&st.mails.length) return (0.8+st.mails.length*0.4).toFixed(1)+"s";
  return (0.4+Math.random()*0.9).toFixed(1)+"s";
}

function renderTasksPane(box){
  const f=fx();
  if(!box||!f)return;
  const list=(f.tasks||[]).filter(t=>wfOpenTasks.includes(t.id));
  if(!list.length){
    box.innerHTML=`<div class="pv-empty">${wfRunning?"Creating tasks as the run progresses…":"No tasks yet. Run Test to create tasks from email."}</div>`;
    return;
  }
  box.innerHTML=`<div class="task-list">`+list.map(t=>{
    const p=wfTaskProg[t.id];
    const st=p?p.status:"";
    const creating=st==="run"&&(p.i||0)<=1;
    const mk=st==="done"?"✓":st==="run"?"▶":"○";
    const steps=(t.steps||[]).map((s,idx)=>{
      const key=stepKey(t.id,s.id);
      const beat=wfStepData[key];
      let sst="";
      if(beat) sst=(p&&p.status==="run"&&p.stepId===s.id)?"run":"done";
      else if(p&&p.status==="run"&&p.stepId===s.id) sst="run";
      const smk=sst==="done"?"✓":sst==="run"?"▶":"○";
      return `<div class="task-step ${sst}"><span class="mk">${smk}</span><span class="sn">${idx+1}. ${s.name}</span></div>`;
    }).join("");
    const resObj=wfTaskResults[t.id]||(st==="done"?rewriteMailRefs(t.result):null);
    const resHtml=resObj?`<div class="tresult"><div class="tresult-lab">Result</div><pre>${escHtml(jsonPretty(resObj))}</pre></div>`:"";
    return `<div class="task-card ${st}${creating?" creating":""}" data-tid="${t.id}">
      <div class="th"><span class="tid">${mk} ${t.id}</span><span class="tt" title="${escHtml(t.title)}">${escHtml(t.title)}</span></div>
      <div class="tm">${escHtml(t.agent||"Agent")} · ${taskProgressLine(t.id)}</div>
      <div class="task-steps">${steps}</div>
      ${resHtml}
    </div>`;
  }).join("")+`</div>`;
  if(wfRunning){
    const runStep=box.querySelector(".task-step.run")||box.querySelector(".task-card.run")||box.querySelector(".task-card:last-child");
    if(runStep) runStep.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

function renderLogPane(box){
  const f=fx();
  if(!box||!f)return;
  const ordered=wfLogs.slice();
  const res=wfResult?`<div class="pv-result-banner">${escHtml(wfResult)}</div>`:(wfRunning?`<div class="pv-result-banner">Running…</div>`:"");
  if(!ordered.length){
    box.innerHTML=`${res}<div class="log-head">${escHtml(f.label)}</div><div class="pv-empty">Click Run Test. Steps append here in time order (oldest → newest).</div>`;
    return;
  }
  const rows=ordered.map((l,i)=>{
    const st=l.beat||{};
    const cls=l.k==="risk"||st.result==="fail"?"risk":(i===ordered.length-1&&wfRunning?"on":"ok");
    const schema=deriveLogSchema(st);
    const time=l.at||logTimeFor(st, l.seq||i);
    const agent=st.agent||"—";
    const node=st.node||st.title||l.s||"—";
    let action=typeof st.action==="string"?st.action:(Array.isArray(st.action)?st.action.join(" · "):(st.s||"—"));
    if(st.mails&&st.mails.length){
      const labels=st.mails.map(mailStreamLabel).join(", ");
      action=action+" · mail "+labels;
    }
    const result=st.result!=null?String(st.result):(st.k==="risk"?"fail":"ok");
    const resCls=result==="pass"||result==="ok"?"ok":(result==="fail"||result==="risk"?"risk":"ok");
    const human=!!st.human;
    const humanBadge=human?`<span class="log-human">human</span>`:"";
    return `<div class="log-row ${cls}" data-log="${i}">
      <div class="log-dot"></div>
      <div class="log-meta">
        <span class="log-time">${escHtml(time)}</span>
        <span class="log-agent">${escHtml(agent)}</span>
        <span class="log-node">${escHtml(node)}</span>
        ${humanBadge}
      </div>
      <div class="log-action">${escHtml(action)}</div>
      <div class="log-result ${resCls}">result · ${escHtml(result)}</div>
      <div class="log-schema" tabindex="0">
        <span class="log-schema-sum">data { input · tools · output }</span>
        <div class="log-schema-pop">${escHtml(jsonPretty(schema))}</div>
      </div>
    </div>`;
  }).join("");
  box.innerHTML=`<div class="log-head">${escHtml(f.label)} · timeline · oldest → newest</div><div class="log-tl">${rows}</div>${res}`;
  const last=box.querySelector(".log-row:last-child");
  if(last) last.scrollIntoView({block:"nearest",behavior:wfRunning?"smooth":"auto"});
}

function renderPvMails(){
  const box=document.getElementById("pvMailPane");
  if(!box)return;
  if(!wfLiveMails.length&&!wfTakeoverPhase){
    box.innerHTML=`<div class="pv-empty">IN / OUT emails appear here as the run progresses.</div>`;
    return;
  }
  const last=wfLiveMails[wfLiveMails.length-1];
  let html=`<div class="thread">`;
  wfLiveMails.forEach((id,idx)=>{
    const m=MAIL[id]; if(!m)return;
    const isIn=m.dir==="IN";
    const isHumanOut=!isIn&&/specialist|priya|\bhuman\b/i.test(m.from||"");
    const dir=isIn?"in":"out";
    const rowExtra=isHumanOut?" human-out":"";
    const icon=isIn?'<span class="mail-icon" title="Human">👤</span>':(isHumanOut?'<span class="mail-icon" title="Specialist">🧑‍💼</span>':'<span class="mail-icon" title="AI Agent">🤖</span>');
    const who=isIn?"HUMAN":(isHumanOut?"SPECIALIST":"AI");
    const neu=(wfRunning&&id===last&&wfTakeoverPhase!=="await")?" new":"";
    const disc=m.disclosure?`<div class="md">${m.disclosure}</div>`:"";
    html+=`<div class="thread-row ${dir}${rowExtra}" data-mail="${id}">
      <div class="thread-msg${neu}">
        <div class="mh"><span>${icon}${who} · ${m.dir} · ${m.time}</span><span>#${idx+1}</span></div>
        <div class="ms">${m.subject}</div>
        <div class="mf">${m.from}</div>
        <div class="mb">${m.body}</div>${disc}
      </div>
    </div>`;
    // Insert takeover card in chronological order: after the mail where Autopilot paused
    if(wfTakeoverPhase&&(idx+1)===wfTakeoverAfter) html+=takeoverCardHtml();
  });
  // If paused with zero mails somehow, still show card
  if(wfTakeoverPhase&&wfTakeoverAfter<=0) html+=takeoverCardHtml();
  html+=`</div>`;
  box.innerHTML=html;
  const btn=document.getElementById("btnHumanTakeover");
  if(btn){
    btn.onclick=()=>{
      if(wfTakeoverPhase!=="await")return;
      wfAwaitHuman=false;
      wfTakeoverPhase="done";
      applyTicketDirect({
        status:"In Progress",
        statusClass:"progress",
        owner:"Priya N. · Dispute",
        note:"Specialist took over.",
        summary:"Ask: Unrecognized $4,800 — refund?\nAutopilot: Docs validated · money blocked · paused for human\nHuman: Priya N. took over — drafting specialist update\nWaiting: —\nTicket: In Progress (human)\nDispute case (SoR): under investigation"
      }, "Takeover");
      renderPvMails();
      renderRightPane();
      const resume=wfHumanResume;
      wfHumanResume=null;
      // Show "Takeover successful" first, then continue to specialist email
      wfTimer=setTimeout(()=>{ if(resume) resume(); }, 900);
    };
  }
  if(wfRunning){
    const el=box.querySelector("[data-takeover] .takeover-card")||box.querySelector(".thread-msg.new");
    if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

function renderTickets(){
  if(!wfTicketLive){
    return `<div class="pv-empty">No tickets yet. Run Test — a ticket opens after the first inbound email.</div>`;
  }
  const t=wfTicketLive;
  const files=(t.files&&t.files.length)
    ? `<ul class="tfiles">${t.files.map(f=>`<li>${escHtml(f.name)}${f.note?" · "+escHtml(f.note):""}</li>`).join("")}</ul>`
    : `<ul class="tfiles"><li class="empty">No attachments yet</li></ul>`;
  const linked=wfOpenTasks.length?wfOpenTasks.join(", "):"—";
  const sc=t.statusClass||"open";
  const card=`<div class="ticket-card">
    <div class="tid-row"><span class="tid">${escHtml(t.id)}</span><span class="tstatus ${escHtml(sc)}">${escHtml(t.status)}</span></div>
    <div class="tt">${escHtml(t.title)}</div>
    <div class="tm">Customer · ${escHtml(t.customer)}<br>Owner · ${escHtml(t.owner)}<br>Linked tasks · ${escHtml(linked)}</div>
    <div class="tsec"><div class="tsec-lab">Attachments / files</div>${files}</div>
    <div class="tsec"><div class="tsec-lab">Latest bot summary</div><div class="tsummary">${escHtml(t.summary||"—")}</div></div>
  </div>`;
  if(!wfTicketLogs.length) return card;
  const rows=wfTicketLogs.map((u,i)=>{
    const on=i===wfTicketLogs.length-1&&wfRunning?" on":"";
    const fileTxt=(u.files&&u.files.length)?u.files.map(f=>f.name).join(", "):"";
    return `<div class="ticket-upd-row${on}">
      <div class="tud"></div>
      <div class="tu-meta">
        <span class="tu-status">${escHtml(u.status)}</span>
        <span class="tu-time">${escHtml(u.at)}</span>
        <span class="tu-owner">${escHtml(u.owner||"—")}</span>
      </div>
      ${u.detail?`<div class="tu-detail">${escHtml(u.detail)}</div>`:""}
      ${fileTxt?`<div class="tu-detail">Files · ${escHtml(fileTxt)}</div>`:""}
    </div>`;
  }).join("");
  return card+`<div class="ticket-upd-head">Lifecycle · Open → In Progress → Waiting → Resolved → Closed</div><div class="ticket-upd">${rows}</div>`;
}

function fieldRow(label, val){
  if(val==null||val===""||val==="—") return "";
  return `<div class="cfg-field compact"><label>${label}</label><div class="val">${escHtml(val)}</div></div>`;
}

function renderCfgField(f){
  const map=f.maps?`<div class="cfg-field-map">${escHtml(f.maps)}</div>`:"";
  if(f.type==="toggle"){
    return `<div class="toggle-row"><span>${escHtml(f.label)}${map}</span><span class="tog ${f.on?"":"off"}"></span></div>`;
  }
  if(f.type==="checks"){
    const items=(f.items||[]).map(it=>`<label><input type="checkbox" ${it.on?"checked":""} disabled> ${escHtml(it.t)}</label>`).join("");
    return `<div class="cfg-field"><label>${escHtml(f.label)}</label><div class="check-list">${items}</div>${map}</div>`;
  }
  if(f.type==="select"){
    const opts=(f.options||[]).map(o=>`<option ${o===f.value?"selected":""}>${escHtml(o)}</option>`).join("");
    return `<div class="cfg-field"><label>${escHtml(f.label)}</label><select disabled>${opts}</select>${map}</div>`;
  }
  return `<div class="cfg-field"><label>${escHtml(f.label)}</label><div class="val">${escHtml(f.value||"—")}</div>${map}</div>`;
}

function renderSimpleCfg(box, n){
  const group=n.group||"system";
  const cfg=SIMPLE_CFG[group]||SIMPLE_CFG.system;
  const zones=(cfg.zones||[{lab:"Settings",fields:cfg.fields||[]}]).map(z=>{
    const fields=(z.fields||[]).map(renderCfgField).join("");
    return `<div class="cfg-zone"><div class="cfg-zone-lab">${escHtml(z.lab)}</div>${fields}</div>`;
  }).join("");
  box.innerHTML=`
    <div class="cfg-mode">
      <button type="button" class="on" data-mode="simple">Simple</button>
      <button type="button" data-mode="advanced">Advanced</button>
    </div>
    <p class="cfg-hint">Business configuration for this packaged module. Switch to Advanced for model / API details on the selected step.</p>
    <div class="cfg-node-title">${escHtml(cfg.title)}</div>
    ${cfg.role?`<div class="cfg-subtitle">${escHtml(cfg.role)}</div>`:""}
    ${zones}`;
  box.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick=()=>{cfgMode=b.dataset.mode;renderRightPane();};
  });
}

function renderAdvSection(title, bodyHtml){
  if(!bodyHtml||!String(bodyHtml).trim()) return "";
  return `<details class="cfg-sec" open><summary>${escHtml(title)}</summary><div class="cfg-sec-body">${bodyHtml}</div></details>`;
}

function renderAdvancedCfg(box, n){
  const key=n.innerKey;
  const cfg=key&&INNER_NODES[key]?INNER_NODES[key]:null;
  const modeBar=`<div class="cfg-mode">
    <button type="button" data-mode="simple">Simple</button>
    <button type="button" class="on" data-mode="advanced">Advanced</button>
  </div>`;
  if(cfg){
    const type=cfg.type||"api";
    const modelSec=cfg.model?renderAdvSection("Model",
      fieldRow("Provider", cfg.model.provider)+
      fieldRow("Model ID", cfg.model.model)+
      fieldRow("Temperature", cfg.model.temperature)+
      (cfg.model.prompt?`<div class="cfg-field compact"><label>Prompt template</label><div class="val">${escHtml(cfg.model.prompt)}</div></div>`:"")
    ):"";
    const knowSec=cfg.knowledge?renderAdvSection("Knowledge / Data Source",
      fieldRow("Sources", cfg.knowledge.sources)+
      fieldRow("Retrieval", cfg.knowledge.retrieval)+
      fieldRow("Top-K", cfg.knowledge.topK)+
      fieldRow("Filters", cfg.knowledge.filters)
    ):"";
    const apiSec=cfg.api?renderAdvSection("Action / API",
      fieldRow("Endpoint", cfg.api.endpoint)+
      fieldRow("Method", cfg.api.method)+
      fieldRow("Parameters", cfg.api.parameters)+
      fieldRow("Authentication", cfg.api.auth)+
      fieldRow("Rate / timeout", cfg.api.limits)
    ):"";
    const outSec=cfg.output?renderAdvSection("Output",
      fieldRow("Schema", cfg.output.schema)
    ):"";
    const govSec=cfg.governance?renderAdvSection("Governance",
      fieldRow("Gate / Threshold", cfg.governance.threshold)+
      fieldRow("Retry", cfg.governance.retry)+
      fieldRow("Fallback", cfg.governance.fallback)+
      fieldRow("Human Approval", cfg.governance.humanApproval)
    ):"";
    box.innerHTML=`${modeBar}
      <p class="cfg-hint">Step-level admin settings. Empty sections are hidden by node type (${escHtml(type)}).</p>
      <div class="cfg-node-title">${escHtml(n.title)}</div>
      ${cfg.subtitle?`<div class="cfg-subtitle">${escHtml(cfg.subtitle)}</div>`:""}
      <div class="cfg-meta-row">
        <span class="cfg-type ${escHtml(type)}">${escHtml(type)}</span>
        ${cfg.from?`<span class="cfg-from">← ${escHtml(cfg.from)}</span>`:""}
      </div>
      ${cfg.simpleCtrl?`<div class="cfg-map"><b>Controlled by Simple:</b> ${escHtml(cfg.simpleCtrl)}</div>`:""}
      ${modelSec}${knowSec}${apiSec}${outSec}${govSec}`;
  }else{
    const outSec=(n.outputs&&n.outputs.length)?renderAdvSection("Output",
      n.outputs.map(t=>fieldRow("Item", t)).join("")
    ):"";
    box.innerHTML=`${modeBar}
      <div class="cfg-node-title">${escHtml(n.title)}</div>
      <div class="cfg-subtitle">${escHtml(n.tool||"System step — use Simple for package toggles.")}</div>
      ${outSec||`<div class="pv-empty">No advanced step config. Switch to Simple for package settings.</div>`}`;
  }
  box.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick=()=>{cfgMode=b.dataset.mode;renderRightPane();};
  });
}

function renderWfCfgInto(box){
  const n=wfNodeById(wfSel);
  if(!n){box.innerHTML=`<div class="pv-empty">Select a canvas step to configure.</div>`;return}
  if(cfgMode==="advanced") renderAdvancedCfg(box, n);
  else renderSimpleCfg(box, n);
}

function renderRightPane(){
  const box=document.getElementById("rightBody");
  if(!box)return;
  setRightTab();
  if(wfTab==="tickets"){box.innerHTML=renderTickets();return}
  if(wfTab==="tasks"){renderTasksPane(box);return}
  if(wfTab==="log"){renderLogPane(box);return}
  if(wfTab==="cfg"){renderWfCfgInto(box);return}
}

function renderSidePanels(){
  renderPvMails();
  renderRightPane();
}

function applyView(){
  const sc=document.getElementById("wfStageScale");
  const lab=document.getElementById("zoomLabel");
  if(sc)sc.style.transform=`translate(${wfPanX}px,${wfPanY}px) scale(${wfZoom})`;
  if(lab)lab.textContent=Math.round(wfZoom*100)+"%";
}
function setZoom(z){
  wfZoom=Math.max(0.3,Math.min(1.6,Math.round(z*100)/100));
  applyView();
}
function setPan(x,y){wfPanX=x;wfPanY=y;applyView()}

function fitCanvasToView(){
  const wrap=document.getElementById("wfCanvasWrap");
  if(!wrap)return;
  const pad=16;
  const zw=(wrap.clientWidth-pad)/1180;
  const zh=(wrap.clientHeight-pad)/920;
  const fit=Math.min(zw,zh,1)*0.92;
  setZoom(fit);
  setPan(10,10);
}

function applySkip(f){
  const groups=new Set(f.skipGroups||[]);
  const nodes=new Set(f.skipNodes||[]);
  WF_NODES.forEach(n=>{
    if(groups.has(n.group)||nodes.has(n.id)) wfMark[n.id]="skip";
  });
}

function runWfTest(kind){
  if(wfTimer)clearTimeout(wfTimer);
  wfLastKind=kind;
  const f=FIXTURES[kind];
  wfRunning=true;
  wfTasksLocked=false;
  wfAwaitHuman=false;
  wfTakeoverPhase=null;
  wfTakeoverAfter=0;
  wfHumanResume=null;
  wfTab="tickets";
  wfLogs=[];wfLogSeq=0;wfResult="";wfMark={};wfDur={};
  wfLiveMails=[];wfStepData={};wfTaskProg={};
  wfOpenTasks=[];wfTaskResults={};wfTicketLive=null;wfTicketLogs=[];
  applySkip(f);
  setRightTab();renderWfCanvas();
  renderSidePanels();
  let i=0;

  const finishBeat=(nid,st,done)=>{
    wfTimer=setTimeout(()=>{
      wfMark[nid]=st.k==="risk"?"risk":"done";
      renderWfCanvas();
      done();
    }, st._phaseDelay||1200);
  };

  const refreshCurrentPane=()=>{
    setRightTab();
    renderRightPane();
  };

  const tick=()=>{
    if(i>=f.run.length){
      Object.keys(wfMark).forEach(id=>{if(wfMark[id]==="run")wfMark[id]="done"});
      Object.keys(wfTaskProg).forEach(tid=>{if(wfTaskProg[tid].status==="run")wfTaskProg[tid].status="done"});
      wfResult=f.result;
      wfRunning=false;
      wfTasksLocked=false;
      wfAwaitHuman=false;
      wfTab="log";
      setRightTab();
      renderWfCanvas();
      renderSidePanels();
      return;
    }
    const st=f.run[i];
    const nid=beatNodeId(st);
    Object.keys(wfMark).forEach(id=>{if(wfMark[id]==="run")wfMark[id]="done"});
    wfMark[nid]="run";
    if(nid==="doc-output"){
      wfMark["doc-crosscheck"]="done";
      if(st.taskId) wfStepData[stepKey(st.taskId,"crosscheck")]=st;
    }
    if(nid==="exception-classify"){
      wfMark["exception-ingest"]="done";
    }
    if(nid==="human"){
      wfMark["exception-handover"]="done";
      wfMark["exception-learn"]="done";
    }
    const dur=durationFor(st);
    wfDur[nid]=dur;
    const _seq=wfLogSeq++;
    const _at=logTimeFor(st,_seq);
    wfLogs.push({k:st.k,s:st.s||st.title,beat:st,seq:_seq,at:_at});
    wfSel=nid;

    const newMails=[];
    (st.mails||[]).forEach(id=>{
      if(!wfLiveMails.includes(id)){ wfLiveMails.push(id); newMails.push(id); }
    });
    const hasMail=newMails.length>0;
    const hasTask=!!st.taskId;
    const hasTicketUpdate=!!st.ticket||hasMail;

    renderWfCanvas();
    if(hasMail) renderPvMails();
    if(hasTicketUpdate) applyTicketPatch(st,_at);

    const afterTasks=(extraDelay)=>{
      st._phaseDelay=(extraDelay!=null?extraDelay:((hasMail?1600:1200)+(st._newTask?400:0)));
      finishBeat(nid,st,()=>{
        if(st.waitHuman){
          wfAwaitHuman=true;
          wfTakeoverPhase="await";
          wfTakeoverAfter=wfLiveMails.length;
          wfHumanResume=()=>{ i++; tick(); };
          renderPvMails();
          refreshCurrentPane();
          return;
        }
        i++; tick();
      });
    };

    if(wfTasksLocked){
      if(hasTask) applyTaskBeat(st);
      // Auto-tab stays on tasks only as policy for auto-switch;
      // never force-overwrite if user manually changed tabs.
      refreshCurrentPane();
      if(hasMail||wfAwaitHuman) renderPvMails();
      afterTasks();
      return;
    }

    if(hasTicketUpdate&&!hasTask){
      wfTab="tickets";
      refreshCurrentPane();
      afterTasks(hasMail?1500:1100);
      return;
    }

    if(hasTicketUpdate&&hasTask){
      wfTab="tickets";
      refreshCurrentPane();
      if(hasMail) renderPvMails();
      wfTimer=setTimeout(()=>{
        applyTaskBeat(st);
        wfTab="tasks";
        wfTasksLocked=true;
        refreshCurrentPane();
        afterTasks();
      }, 800);
      return;
    }

    if(hasTask){
      applyTaskBeat(st);
      wfTab="tasks";
      wfTasksLocked=true;
      refreshCurrentPane();
      afterTasks();
      return;
    }

    afterTasks(1100);
  };
  tick();
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2800);
}

function renderAdmin(){
  renderWfCanvas();renderSidePanels();setRightTab();fitCanvasToView();
}

document.getElementById("btnWfTest").addEventListener("click",()=>runWfTest(document.getElementById("wfFixture").value));
document.getElementById("wfFixture").addEventListener("change",e=>{
  if(wfTimer)clearTimeout(wfTimer);
  wfLastKind=e.target.value;
  wfRunning=false;wfLogs=[];wfResult="";wfMark={};wfDur={};
  wfLiveMails=[];wfStepData={};wfTaskProg={};wfOpenTasks=[];wfTaskResults={};wfTicketLive=null;wfTicketLogs=[];
  wfTasksLocked=false;wfAwaitHuman=false;wfTakeoverPhase=null;wfTakeoverAfter=0;wfHumanResume=null;
  wfTab="tickets";
  applySkip(fx());
  setRightTab();renderWfCanvas();renderSidePanels();
});
document.getElementById("btnZoomIn").addEventListener("click",()=>setZoom(wfZoom+0.1));
document.getElementById("btnZoomOut").addEventListener("click",()=>setZoom(wfZoom-0.1));
document.querySelectorAll("#cfgRail button").forEach(b=>{
  b.addEventListener("click",()=>{
    wfTab=b.dataset.tab;
    setRightTab();
    renderRightPane();
  });
});
const wrap=document.getElementById("wfCanvasWrap");
if(wrap){
  wrap.addEventListener("wheel",e=>{
    if(e.metaKey||e.ctrlKey){
      e.preventDefault();
      setZoom(wfZoom+(e.deltaY<0?0.1:-0.1));
    }
  },{passive:false});
  wrap.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    if(e.target.closest(".wn")||e.target.closest(".wf-zoom"))return;
    wfPanning=true;
    wfPanOrigin={x:e.clientX,y:e.clientY,px:wfPanX,py:wfPanY};
    wrap.classList.add("panning");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove",e=>{
    if(!wfPanning||!wfPanOrigin)return;
    setPan(wfPanOrigin.px+(e.clientX-wfPanOrigin.x), wfPanOrigin.py+(e.clientY-wfPanOrigin.y));
  });
  const endPan=e=>{
    if(!wfPanning)return;
    wfPanning=false;wfPanOrigin=null;
    wrap.classList.remove("panning");
    try{wrap.releasePointerCapture(e.pointerId)}catch(_){}
  };
  wrap.addEventListener("pointerup",endPan);
  wrap.addEventListener("pointercancel",endPan);
}

let _fitTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(_fitTimer);
  _fitTimer=setTimeout(fitCanvasToView,120);
});

renderAdmin();

</script>
